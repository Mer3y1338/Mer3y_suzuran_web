<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>铃兰酱的功能介绍</title>
  <style>
    :root {
      --bg-1: #f8f5ef;
      --bg-2: #eef3f8;
      --card: rgba(255, 255, 255, 0.58);
      --card-strong: rgba(255, 255, 255, 0.7);
      --border: rgba(180, 162, 121, 0.28);
      --text: #43566d;
      --title: #7b6541;
      --gold: #d9b56d;
      --gold-deep: #b89352;
      --blue: #8ea7c2;
      --blue-deep: #6985a3;
      --shadow: 0 18px 40px rgba(105, 133, 163, 0.16);
      --shadow-hover: 0 22px 48px rgba(185, 147, 82, 0.2);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --mouse-x: 50%;
      --mouse-y: 50%;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      overflow-x: hidden;
      cursor: none;
    }

    /* ─── 自定义光标 ─── */
    .cursor-dot {
      position: fixed;
      top: 0; left: 0;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gold-deep);
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    .cursor-ring {
      position: fixed;
      top: 0; left: 0;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(217, 181, 109, 0.6);
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      transition: width 0.3s ease, height 0.3s ease, border-color 0.3s ease;
    }
    .cursor-ring.hovered {
      width: 52px; height: 52px;
      border-color: rgba(217, 181, 109, 0.9);
      background: rgba(217, 181, 109, 0.06);
    }

    /* ─── 粒子画布 ─── */
    #particleCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── 动态背景 ─── */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at top left, rgba(255, 226, 178, 0.55), transparent 32%),
        radial-gradient(circle at top right, rgba(193, 214, 236, 0.5), transparent 28%),
        radial-gradient(circle at bottom center, rgba(255, 239, 211, 0.42), transparent 34%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    /* 鼠标跟随光晕 */
    .mouse-glow {
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle, rgba(217, 181, 109, 0.12) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      transition: left 0.15s ease, top 0.15s ease;
    }

    /* ─── 浮动光球 ─── */
    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(60px);
      animation: floatOrb 10s ease-in-out infinite;
    }
    .orb-1 {
      width: 420px; height: 420px;
      top: -120px; left: -100px;
      background: radial-gradient(circle, rgba(255, 219, 153, 0.45), rgba(255, 219, 153, 0));
    }
    .orb-2 {
      width: 480px; height: 480px;
      right: -130px; bottom: -100px;
      background: radial-gradient(circle, rgba(173, 196, 222, 0.45), rgba(173, 196, 222, 0));
      animation-delay: -5s;
    }
    .orb-3 {
      width: 300px; height: 300px;
      top: 40%; left: 60%;
      background: radial-gradient(circle, rgba(200, 220, 200, 0.25), rgba(200,220,200,0));
      animation-delay: -2s;
      animation-duration: 14s;
    }

    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(18px, -24px) scale(1.04); }
      66% { transform: translate(-14px, 16px) scale(0.97); }
    }

    /* ─── 容器 ─── */
    .container {
      position: relative;
      z-index: 1;
      width: min(1160px, calc(100% - 48px));
      margin: 0 auto;
      padding: 32px 0 80px;
    }

    /* ─── Hero ─── */
    .hero {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 28px;
      align-items: center;
      padding: 28px 32px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(255,255,255,0.62), rgba(255,255,255,0.4));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transform-style: preserve-3d;
      transition: transform 0.1s ease, box-shadow 0.3s ease;
      opacity: 0;
      animation: fadeSlideIn 0.8s cubic-bezier(0.22,1,0.36,1) 0.1s forwards;
    }

    .avatar-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .avatar-ring {
      width: 160px; height: 160px;
      padding: 6px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(217,181,109,0.8), rgba(142,167,194,0.72));
      box-shadow: 0 10px 26px rgba(185,147,82,0.2), inset 0 1px 0 rgba(255,255,255,0.75);
      animation: spinRing 12s linear infinite;
      position: relative;
    }

    @keyframes spinRing {
      from { background-position: 0% 50%; }
      to { background-position: 100% 50%; }
    }

    .avatar-ring::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px dashed rgba(217,181,109,0.35);
      animation: rotateDash 20s linear infinite;
    }

    @keyframes rotateDash {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .avatar-ring img {
      width: 100%; height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      background: linear-gradient(135deg, #fff7ea, #eef4fa);
      border: 3px solid rgba(255,255,255,0.86);
      transition: transform 0.4s ease;
    }

    .avatar-ring:hover img {
      transform: scale(1.06);
    }

    /* 打字机标题 */
    .hero-text h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 3.5vw, 40px);
      line-height: 1.2;
      color: var(--title);
      letter-spacing: 0.02em;
    }

    .typewriter-text {
      border-right: 3px solid var(--gold);
      animation: blinkCaret 0.75s step-end infinite;
    }

    @keyframes blinkCaret {
      0%, 100% { border-color: var(--gold); }
      50% { border-color: transparent; }
    }

    .hero-text p {
      margin: 0 0 16px;
      font-size: 15px;
      line-height: 1.8;
      color: var(--blue-deep);
    }

    /* 状态标签 */
    .status-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }
    .badge-online {
      background: rgba(82, 196, 126, 0.15);
      border: 1px solid rgba(82, 196, 126, 0.3);
      color: #3a9e6a;
    }
    .badge-online::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #52c47e;
      box-shadow: 0 0 0 3px rgba(82,196,126,0.2);
      animation: pulse 2s ease infinite;
    }
    .badge-offline {
      background: rgba(220, 80, 80, 0.15);
      border: 1px solid rgba(220, 80, 80, 0.3);
      color: #c0392b;
    }
    .badge-offline::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #e74c3c;
      box-shadow: 0 0 0 3px rgba(231,76,60,0.2);
    }
    .badge-loading {
      background: rgba(142,167,194,0.15);
      border: 1px solid rgba(142,167,194,0.3);
      color: var(--blue-deep);
    }
    .badge-loading::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--blue);
      animation: pulse 1s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(82,196,126,0.2); }
      50% { box-shadow: 0 0 0 6px rgba(82,196,126,0.05); }
    }
    .badge-gold {
      background: rgba(217,181,109,0.15);
      border: 1px solid rgba(217,181,109,0.3);
      color: var(--gold-deep);
    }
    .badge-blue {
      background: rgba(142,167,194,0.15);
      border: 1px solid rgba(142,167,194,0.3);
      color: var(--blue-deep);
    }

    /* ─── 分区标题 ─── */
    .section-category {
      margin: 28px 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      animation: fadeSlideIn 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    .section-category-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(180,162,121,0.4), transparent);
    }
    .section-category-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-deep);
      white-space: nowrap;
    }

    /* ─── 卡片网格 ─── */
    .section-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .section-list.triple {
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .section-card {
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255,255,255,0.42));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
      opacity: 0;
      transform: translateY(20px);
      transition: transform 0.08s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .section-card.visible {
      animation: fadeSlideIn 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    .section-card:hover {
      box-shadow: var(--shadow-hover);
      border-color: rgba(217, 181, 109, 0.35);
    }

    .section-card.wide {
      grid-column: span 2;
    }

    /* 卡片图标 emoji */
    .section-icon {
      font-size: 22px;
      line-height: 1;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(180,162,121,0.18);
      background: linear-gradient(90deg, rgba(255,246,228,0.62), rgba(236,243,250,0.38));
    }

    .section-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--blue));
      box-shadow: 0 0 0 4px rgba(255,255,255,0.48);
      flex-shrink: 0;
    }

    .section-title {
      margin: 0;
      font-size: 18px;
      color: var(--title);
      font-weight: 700;
      letter-spacing: 0.02em;
      flex: 1;
    }

    .section-count {
      font-size: 11px;
      color: var(--blue-deep);
      background: rgba(142,167,194,0.12);
      border: 1px solid rgba(142,167,194,0.2);
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* ─── 命令列表 ─── */
    .command-list {
      display: grid;
      gap: 10px;
      padding: 16px 20px 20px;
    }

    .command-item {
      width: 100%;
      border: 1px solid rgba(142,167,194,0.18);
      background: linear-gradient(135deg, rgba(255,255,255,0.82), rgba(244,248,252,0.7));
      border-radius: var(--radius-md);
      padding: 14px 16px;
      text-align: left;
      color: var(--text);
      cursor: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      box-shadow: 0 6px 16px rgba(105,133,163,0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }

    /* 点击涟漪 */
    .command-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--rx, 50%) var(--ry, 50%), rgba(217,181,109,0.3), transparent 60%);
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .command-item.ripple::after {
      opacity: 1;
      transition: opacity 0s;
    }

    .command-item:hover {
      transform: translateY(-2px) scale(1.005);
      box-shadow: var(--shadow-hover);
      border-color: rgba(217,181,109,0.35);
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,249,239,0.82));
    }

    .command-item:active {
      transform: translateY(0) scale(0.99);
    }

    .command-main {
      min-width: 0; flex: 1;
      font-size: 15px;
      line-height: 1.65;
      word-break: break-word;
    }

    .command-copy {
      flex-shrink: 0;
      font-size: 12px;
      color: var(--gold-deep);
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255,246,228,0.9);
      border: 1px solid rgba(217,181,109,0.2);
      white-space: nowrap;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }

    .command-item:hover .command-copy {
      background: rgba(217,181,109,0.2);
      border-color: rgba(217,181,109,0.4);
      transform: scale(1.05);
    }

    .cmd {
      font-weight: 700;
      color: var(--blue-deep);
    }

    .dash {
      color: var(--gold-deep);
      margin: 0 4px;
      font-weight: 700;
    }

    /* ─── 统计栏 ─── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 20px 0 20px;
      opacity: 0;
      animation: fadeSlideIn 0.7s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;
    }

    .stat-card {
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(255,255,255,0.65), rgba(255,255,255,0.45));
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      padding: 16px;
      text-align: center;
      box-shadow: var(--shadow);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: none;
    }
    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }
    .stat-num {
      font-size: 28px;
      font-weight: 800;
      color: var(--title);
      line-height: 1;
      margin-bottom: 4px;
      background: linear-gradient(135deg, var(--gold-deep), var(--blue-deep));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-label {
      font-size: 12px;
      color: var(--blue-deep);
      opacity: 0.8;
    }

    /* ─── 搜索框 ─── */
    .search-wrap {
      margin: 0 0 20px;
      position: relative;
      opacity: 0;
      animation: fadeSlideIn 0.65s cubic-bezier(0.22,1,0.36,1) 0.4s forwards;
    }
    .search-input {
      width: 100%;
      padding: 13px 44px 13px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(255,255,255,0.72), rgba(255,255,255,0.5));
      backdrop-filter: blur(14px);
      font-size: 15px;
      color: var(--text);
      outline: none;
      box-shadow: var(--shadow);
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
      cursor: none;
    }
    .search-input::placeholder { color: rgba(105,133,163,0.55); }
    .search-input:focus {
      border-color: rgba(217,181,109,0.5);
      box-shadow: 0 0 0 3px rgba(217,181,109,0.12), var(--shadow);
    }
    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(105,133,163,0.5);
      font-size: 17px;
      pointer-events: none;
    }
    .no-result {
      text-align: center;
      padding: 24px;
      color: rgba(105,133,163,0.5);
      font-size: 14px;
      display: none;
    }

    /* ─── Toast ─── */
    .toast {
      position: fixed;
      right: 20px;
      bottom: 24px;
      z-index: 9999;
      padding: 12px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(67,86,109,0.95), rgba(90,110,135,0.9));
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
      box-shadow: 0 14px 30px rgba(67,86,109,0.28);
      opacity: 0;
      transform: translateY(20px) scale(0.94);
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast::before {
      content: '✓';
      width: 20px; height: 20px;
      background: rgba(82,196,126,0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #52c47e;
      flex-shrink: 0;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* ─── 页脚 ─── */
    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: rgba(105,133,163,0.5);
      padding: 16px 0;
      border-top: 1px solid rgba(180,162,121,0.12);
      opacity: 0;
      animation: fadeSlideIn 0.6s ease 1.2s forwards;
    }
    .footer a {
      color: var(--gold-deep);
      text-decoration: none;
    }

    /* ─── 进入动画 ─── */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── 响应式 ─── */
    @media (max-width: 900px) {
      .section-list.triple { grid-template-columns: repeat(2, 1fr); }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
      .section-list, .section-list.triple { grid-template-columns: 1fr; }
      .section-card.wide { grid-column: span 1; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }

      .container {
        width: calc(100% - 32px);
        padding: 20px 0 84px;
      }
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 18px;
        padding: 22px 24px;
      }
      .status-badges { justify-content: center; }
      .hero-text h1 { font-size: 26px; }
      .cursor-dot, .cursor-ring { display: none; }
      html, body { cursor: auto; }
      .command-item { cursor: pointer; }
      .search-input { cursor: text; }
    }
  </style>
</head>
<body>

  <!-- 自定义光标 -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- 粒子画布 -->
  <canvas id="particleCanvas"></canvas>

  <!-- 背景层 -->
  <div class="bg-layer"></div>
  <div class="mouse-glow" id="mouseGlow"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="container">

    <!-- Hero -->
    <header class="hero" id="heroCard">
      <div class="avatar-wrap">
        <div class="avatar-ring">
          <img src="suzuran.jpg" alt="铃兰头像">
        </div>
      </div>
      <div class="hero-text">
        <h1><span class="typewriter-text" id="typewriterEl"></span></h1>
        <p>点击任意功能条目即可复制对应指令，支持手机和桌面端使用。</p>
        <div class="status-badges">
          <span class="badge badge-loading" id="statusBadge">检测中...</span>
          <span class="badge badge-gold">✦ 铃兰酱</span>
          <span class="badge badge-blue">🤖 QQ机器人</span>
        </div>
      </div>
    </header>

    <!-- 统计栏 -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-card">
        <div class="stat-num" data-target="7">0</div>
        <div class="stat-label">功能模块</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" data-target="23">0</div>
        <div class="stat-label">可用指令</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" data-target="99">0</div>
        <div class="stat-label">在线时长 %</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" data-target="2">0</div>
        <div class="stat-label">服务群组</div>
      </div>
    </div>

    <!-- 搜索框 -->
    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="text" placeholder="🔍 搜索指令或功能描述…" autocomplete="off">
      <span class="search-icon">⌕</span>
    </div>

    <!-- === 核心功能 === -->
    <div class="section-category" style="animation-delay:0.5s">

  <div class="toast" id="toast"></div>

  <script>
  (() => {
    // ─── 粒子系统 ───
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let W, H;

    function resizeCanvas() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() { this.reset(true); }
      reset(init) {
        this.x = Math.random() * W;
        this.y = init ? Math.random() * H : H + 10;
        this.size = Math.random() * 2.5 + 0.5;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = -(Math.random() * 0.5 + 0.15);
        this.opacity = Math.random() * 0.5 + 0.1;
        this.life = 1;
        this.decay = Math.random() * 0.003 + 0.001;
        const type = Math.random();
        this.color = type < 0.5
          ? `rgba(217, 181, 109, ${this.opacity})`
          : `rgba(142, 167, 194, ${this.opacity})`;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        if (this.life <= 0 || this.y < -10) this.reset(false);
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.life * 0.6;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 70; i++) particles.push(new Particle());

    function animateParticles() {
      ctx.clearRect(0, 0, W, H);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ─── 鼠标联动 ───
    const dot = document.getElementById('cursorDot');
    const ring = document.getElementById('cursorRing');
    const glow = document.getElementById('mouseGlow');
    let mx = -200, my = -200;
    let rx = -200, ry = -200;

    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      dot.style.left = mx + 'px';
      dot.style.top = my + 'px';
      glow.style.left = mx + 'px';
      glow.style.top = my + 'px';
    });

    // 光标跟随（稍微滞后）
    function animateCursor() {
      rx += (mx - rx) * 0.12;
      ry += (my - ry) * 0.12;
      ring.style.left = rx + 'px';
      ring.style.top = ry + 'px';
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // 悬浮时光标变大
    document.querySelectorAll('.command-item, .stat-card, .avatar-ring, .badge').forEach(el => {
      el.addEventListener('mouseenter', () => ring.classList.add('hovered'));
      el.addEventListener('mouseleave', () => ring.classList.remove('hovered'));
    });

    // ─── Hero 3D 倾斜 ───
    const hero = document.getElementById('heroCard');
    document.addEventListener('mousemove', e => {
      const rect = hero.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = (e.clientX - cx) / rect.width;
      const dy = (e.clientY - cy) / rect.height;
      const inHero = e.clientX >= rect.left && e.clientX <= rect.right &&
                     e.clientY >= rect.top && e.clientY <= rect.bottom;
      if (inHero) {
        hero.style.transform = `perspective(800px) rotateY(${dx * 8}deg) rotateX(${-dy * 6}deg)`;
      } else {
        hero.style.transform = 'perspective(800px) rotateY(0deg) rotateX(0deg)';
      }
    });

    // ─── 卡片 3D 倾斜 ───
    document.querySelectorAll('.section-card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        const dx = (e.clientX - rect.left) / rect.width - 0.5;
        const dy = (e.clientY - rect.top) / rect.height - 0.5;
        card.style.transform = `perspective(600px) rotateY(${dx * 6}deg) rotateX(${-dy * 5}deg) translateZ(4px)`;
      });
      card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(600px) rotateY(0deg) rotateX(0deg) translateZ(0)';
      });
    });

    // ─── 打字机效果 ───
    const text = '这里是 Mer3y 的铃兰酱功能介绍';
    const el = document.getElementById('typewriterEl');
    let idx = 0;
    function typeNext() {
      if (idx <= text.length) {
        el.textContent = text.slice(0, idx);
        idx++;
        setTimeout(typeNext, idx < 8 ? 120 : 80);
      }
    }
    setTimeout(typeNext, 600);

    // ─── 数字滚动统计 ───
    function animateNum(el, target) {
      let cur = 0;
      const step = Math.max(1, Math.floor(target / 30));
      const timer = setInterval(() => {
        cur = Math.min(cur + step, target);
        el.textContent = cur + (el.dataset.suffix || '');
        if (cur >= target) clearInterval(timer);
      }, 40);
    }
    setTimeout(() => {
      document.querySelectorAll('.stat-num[data-target]').forEach(el => {
        animateNum(el, parseInt(el.dataset.target));
      });
    }, 500);

    // ─── Scroll 入场动画 ───
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const delay = (parseInt(entry.target.dataset.delay) || 0) * 100;
          setTimeout(() => entry.target.classList.add('visible'), delay);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.section-card').forEach(c => observer.observe(c));

    // ─── 点击涟漪 ───
    document.querySelectorAll('.command-item').forEach(item => {
      item.addEventListener('click', function(e) {
        const rect = this.getBoundingClientRect();
        const rx = ((e.clientX - rect.left) / rect.width * 100).toFixed(1) + '%';
        const ry = ((e.clientY - rect.top) / rect.height * 100).toFixed(1) + '%';
        this.style.setProperty('--rx', rx);
        this.style.setProperty('--ry', ry);
        this.classList.add('ripple');
        setTimeout(() => this.classList.remove('ripple'), 600);
      });
    });

    // ─── 复制功能 ───
    const toast = document.getElementById('toast');
    let toastTimer = null;

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
          document.body.appendChild(ta);
          ta.focus(); ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        showToast('已复制：' + text);
      } catch(e) {
        showToast('复制失败，请手动复制');
      }
    }

    document.querySelectorAll('.command-item').forEach(item => {
      item.addEventListener('click', () => {
        const cmd = item.getAttribute('data-command') || '';
        copyText(cmd.trim());
      });
    });

    // ─── 搜索过滤 ───
    const searchInput = document.getElementById('searchInput');
    const noResult = document.getElementById('noResult');

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      let anyVisible = false;

      document.querySelectorAll('.command-item').forEach(item => {
        const text = item.textContent.toLowerCase();
        const cmd = (item.dataset.command || '').toLowerCase();
        const match = !q || text.includes(q) || cmd.includes(q);
        item.style.display = match ? '' : 'none';
        if (match) anyVisible = true;
      });

      // 隐藏空卡片
      document.querySelectorAll('.section-card').forEach(card => {
        const visible = [...card.querySelectorAll('.command-item')].some(i => i.style.display !== 'none');
        card.style.display = visible ? '' : 'none';
      });

      noResult.style.display = anyVisible ? 'none' : 'block';
    });

    // ─── 统计总指令数 ───
    const total = document.querySelectorAll('.command-item').length;
    document.getElementById('totalCount').textContent = total;

    // ─── AstrBot 状态检测 ───
    const statusBadge = document.getElementById('statusBadge');
    const STATUS_API = 'https://love.mer3y.xyz/api/astrbot-status';

    async function checkAstrbotStatus() {
      try {
        const res = await fetch(STATUS_API, { 
          method: 'GET',
          mode: 'cors',
          cache: 'no-cache'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        
        if (data.status === 'online') {
          statusBadge.className = 'badge badge-online';
          statusBadge.textContent = '在线运行中';
        } else {
          statusBadge.className = 'badge badge-offline';
          statusBadge.textContent = '已停机';
        }
      } catch (e) {
        console.warn('Status check failed:', e);
        statusBadge.className = 'badge badge-offline';
        statusBadge.textContent = '连接失败';
      }
    }

    // 首次检测 + 每 30 秒刷新
    checkAstrbotStatus();
    setInterval(checkAstrbotStatus, 30000);

  })();
  </script>
